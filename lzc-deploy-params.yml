# Portabase Deployment Parameters
# Generated by LazyCat App Publisher Skill
# Setup wizard for user configuration

params:
  - id: timezone
    type: string
    name: "timezone"
    description: "Timezone setting (e.g., Asia/Shanghai, America/New_York)"
    default_value: "Asia/Shanghai"
    optional: false
    placeholder: "Asia/Shanghai"
  - id: smtp_host
    type: string
    name: "SMTP host"
    description: "SMTP server hostname for email notifications"
    default_value: "smtp.gmail.com"
    optional: true

  - id: smtp_port
    type: number
    name: "SMTP port"
    description: "SMTP server port (587 for TLS, 465 for SSL)"
    default_value: 587
    optional: true
    min: 1
    max: 65535

  - id: smtp_user
    type: string
    name: "SMTP username"
    description: "SMTP authentication username"
    default_value: ""
    optional: true

  - id: smtp_password
    type: string
    name: "SMTP password"
    description: "SMTP authentication password"
    default_value: ""
    optional: true
    secure: true

  - id: smtp_from
    type: string
    name: "SMTP from address"
    description: "Email address to send from"
    default_value: ""
    optional: true
    placeholder: "noreply@example.com"

  - id: auth_google_id
    type: string
    name: "Google OAuth Client ID"
    description: "Google OAuth application client ID"
    default_value: ""
    optional: true

  - id: auth_google_secret
    type: string
    name: "Google OAuth Client Secret"
    description: "Google OAuth application client secret"
    default_value: ""
    optional: true
    secure: true

  - id: auth_google_method
    type: string
    name: "Google OAuth Method"
    description: "Authentication method for Google OAuth"
    default_value: ""
    optional: true
    placeholder: "oauth2"

locales:
