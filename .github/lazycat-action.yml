version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: portabase

build:
  run_buildscript: false

images:
  - id: portabase
    target: service
    service: portabase-app
    source: docker.io/portabase/portabase
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

  - id: postgres
    target: service
    service: db
    source: docker.io/library/postgres
    channel: custom
    sort: semver
    tag_regex: '^16\.\d+-alpine3\.\d+$'
    version_regex: '^(?P<version>16\.\d+)-alpine3\.\d+$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: Portabase
      source: https://github.com/Portabase/portabase
      source_author: Portabase
  private:
    enabled: true
    skip_if_version_exists: true
    name: Portabase
    summary: 由 GitHub Actions 自动发布
