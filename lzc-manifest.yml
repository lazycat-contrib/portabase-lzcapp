# Portabase Application Manifest
# Generated by LazyCat App Publisher Skill
# Conversion from docker-compose.yml

name: Portabase
package: community.lazycat.app.portabase
version: 1.2.4
min_os_version: 1.3.8
description: "Database backup & restore tool for PostgreSQL, MySQL/MariaDB, MongoDB"
license: MIT
homepage: https://github.com/portabase/portabase
author: Portabase Team

application:
  subdomain: portabase
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://portabase-app:80/

services:
  db:
    image: registry.lazycat.cloud/czyt/library/postgres:da955d1f9b777e01
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devuser
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U devuser -d devdb
      interval: 10s
      timeout: 5s
      retries: 5
    binds:
      - /lzcapp/var/data:/var/lib/postgresql/data
    cpu_shares: 512
    mem_limit: 512M

  portabase-app:
    # solucetechnologies/portabase:1.2.4-rc.2
    image: registry.lazycat.cloud/czyt/solucetechnologies/portabase:86089012627fb6aa
    environment:
      - TZ={{.U.timezone}}
      - NODE_ENV=production
      - DATABASE_URL=postgresql://devuser:devuser@db:5432/devdb?schema=public
      - PROJECT_NAME=Portabase
      - PROJECT_DESCRIPTION=Portabase is a powerful database manager
      - PROJECT_URL=https://${LAZYCAT_APP_DOMAIN}
      - PROJECT_SECRET={{ stable_secret "project_secret" }}
      - RETENTION_CRON=* * * * *
    depends_on:
      - db
    cpu_shares: 1024
    mem_limit: 1024M

locales:
  en:
    name: "Portabase"
    description: "Database backup & restore tool for PostgreSQL, MySQL/MariaDB, MongoDB"
  zh:
    name: "Portabase"
    description: "适用于 PostgreSQL、MySQL/MariaDB、MongoDB 的数据库备份和恢复工具"

unsupported_platforms:
  - ios
  - android
  - tvos
